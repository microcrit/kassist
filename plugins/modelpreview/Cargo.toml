[package]
name = "modelpreview"
version = "0.1.0"
edition = "2024"
description = "GLB, glTF, and FBX wireframe preview and MakeHuman profile builder"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
components = { path = "../../crates/components" }
stonecutter = { path = "../../crates/stonecutter", features = ["http-client"] }
